# dnscrypt-proxy default configuration for KeeneticOS.
#
# Based on upstream example-dnscrypt-proxy.toml (2.1.21). Only the options
# that matter on a router are set here. See the upstream file for the full
# list of options and their documentation.
#
# The daemon is expected to be started by the system with
#   mkdir -p /tmp/dnscrypt-proxy
#   dnscrypt-proxy -config /etc/dnscrypt-proxy/dnscrypt-proxy.toml
# because /etc is read-only and all runtime state is kept under /tmp.

## Local address the proxy listens on. Port 53 is left to the system resolver.
listen_addresses = ['127.0.0.1:5359']
max_clients = 250

## Protocols. DNSCrypt and DoH are enabled. Oblivious DoH is supported by the
## daemon, but it only works through a relay, so it is disabled until relay
## routes are configured (see the [anonymized_dns] section at the end).
ipv4_servers = true
ipv6_servers = false
dnscrypt_servers = true
doh_servers = true
odoh_servers = false

## Required server properties. Only resolvers that validate DNSSEC, keep no
## logs and do no filtering are used.
require_dnssec = true
require_nolog = true
require_nofilter = true

## Server selection. Without server_names, the fastest servers that match the
## filters above are used. To pin servers, list their names from
## public-resolvers.md (`dnscrypt-proxy -list` prints the ones that match), or
## the names of [static] entries at the end of this file.
## The require_* filters apply only while server_names is empty. A server that is
## named here is used even if it does not meet them, so check what you pin with
## `dnscrypt-proxy -list-all -json`.
# server_names = ['scaleway-fr', 'quad9-dnscrypt-ip4-nofilter-pri']
# disabled_server_names = []

## Connection settings.
##
## The destination port is part of each server's stamp and is chosen by the
## server operator, not here. To use port 443, pick servers or relays whose
## stamps use it. Most DNSCrypt servers and relays in the public lists do,
## and DoH always runs over HTTPS.
##
## force_tcp sends DNSCrypt queries over TCP instead of UDP. TCP is needed when
## UDP is blocked or fragments are dropped, which also affects Anonymized
## DNSCrypt. It adds latency. DoH always uses TCP unless http3 is enabled.
force_tcp = false

## HTTP/3 (QUIC, UDP) for DNS-over-HTTPS. With http3 = true a server is first
## reached over HTTP/2 and the proxy switches to HTTP/3 when the server announces
## it. Add http3_probe = true to try HTTP/3 first. HTTP/3 needs UDP port 443 to
## be reachable.
http3 = false
# http3_probe = false

## Post-quantum key exchange (PQDNSCrypt) is used when a server supports it.
## This is the upstream default and is listed here to make it visible.
# pqdnscrypt = true

## Linux only, needs a patch that this package applies: set this SO_MARK value on
## every socket used to reach upstream servers, relays, resolver lists and
## bootstrap resolvers, so that routing rules can match it. Needs
## CAP_NET_ADMIN and cannot be combined with user_name. 0 turns it off.
# socket_mark = 0

timeout = 5000
keepalive = 30

## Logging goes to syslog. There is no persistent storage for log files.
use_syslog = true
# log_level = 2

## Names of upstream servers are resolved with these plain DNS servers. If none of
## them answers, the proxy still falls back to the system resolver as a last
## resort, whatever ignore_system_dns says. When the system resolver forwards to
## this proxy, that fallback can loop, so keep the bootstrap resolvers reachable.
bootstrap_resolvers = ['9.9.9.9:53', '1.1.1.1:53']
ignore_system_dns = true
netprobe_timeout = 60
netprobe_address = '9.9.9.9:53'

## Cache
cache = true
cache_size = 4096
cache_min_ttl = 2400
cache_max_ttl = 86400
cache_neg_min_ttl = 60
cache_neg_max_ttl = 600

## Resolver lists. Cache files go to /tmp, the directory must exist
## before the daemon starts.
[sources]

  [sources.public-resolvers]
  urls = [
    'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
    'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md',
    'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/public-resolvers.md'
  ]
  cache_file = '/tmp/dnscrypt-proxy/public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 73
  prefix = ''

  ## Anonymized DNSCrypt relays
  [sources.relays]
  urls = [
    'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md',
    'https://download.dnscrypt.info/resolvers-list/v3/relays.md',
    'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/relays.md'
  ]
  cache_file = '/tmp/dnscrypt-proxy/relays.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 73
  prefix = ''

  ## Oblivious DoH servers and relays. To use ODoH, uncomment these two
  ## sources, set odoh_servers = true and define routes (see below).
  # [sources.odoh-servers]
  # urls = [
  #   'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-servers.md',
  #   'https://download.dnscrypt.info/resolvers-list/v3/odoh-servers.md',
  #   'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-servers.md'
  # ]
  # cache_file = '/tmp/dnscrypt-proxy/odoh-servers.md'
  # minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  # refresh_delay = 73
  # prefix = ''
  #
  # [sources.odoh-relays]
  # urls = [
  #   'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/odoh-relays.md',
  #   'https://download.dnscrypt.info/resolvers-list/v3/odoh-relays.md',
  #   'https://cdn.jsdelivr.net/gh/DNSCrypt/dnscrypt-resolvers@master/v3/odoh-relays.md'
  # ]
  # cache_file = '/tmp/dnscrypt-proxy/odoh-relays.md'
  # minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  # refresh_delay = 73
  # prefix = ''

## The monitoring web interface is disabled. Upstream's defaults for it include
## the credentials admin/changeme, so do not enable it without changing them.
[monitoring_ui]
enabled = false

## Anonymized DNSCrypt and Oblivious DoH routes.
##
## Queries are sent through a relay only when a route is defined. Relay names
## come from relays.md and odoh-relays.md (`dnscrypt-proxy -list -include-relays`).
## A relay can also be given directly as a relay stamp. Choose a relay and a
## server operated by different entities.
## Example (names are placeholders):
# [anonymized_dns]
# routes = [
#   { server_name='scaleway-fr', via=['anon-example-1', 'anon-example-2'] },
#   { server_name='custom-dnscrypt', via=['sdns://gQ0xOTIuMC4yLjI6NDQz'] }
# ]
# skip_incompatible = false
# direct_cert_fallback = false

## Custom servers that are not in the public lists, for example a private
## DNSCrypt server or a resolver profile. Each entry needs the server's DNS stamp
## (sdns://...), which encodes the protocol, address, port and keys. Add the
## entry name to server_names above to use it. A stamp can contain a personal
## profile identifier, so treat it as private.
## Example. The stamps in this file are well-formed placeholders that use the
## documentation address range 192.0.2.0/24 and an all-zero key, so they never
## reach a real server.
# [static]
#   [static.custom-dnscrypt]
#   stamp = 'sdns://AQcAAAAAAAAADTE5Mi4wLjIuMTo0NDMgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAbMi5kbnNjcnlwdC1jZXJ0LmV4YW1wbGUuY29t'
